name: Shell Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq

      - name: Run shell lint
        run: make lint

      - name: Run offline tests
        run: make test
